[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue-reader"
version = "0.5.1"
description = "A terminal-based eBook reader with modular text-to-speech capabilities and multi-format support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Yue contributors"},
    {name = "Lue contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
    "Environment :: Console",
]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.2.0",
    "striprtf>=0.0.29",
    "rich>=14.1.0",
    "PyMuPDF>=1.26.3",
    "Markdown>=3.8.2",
    "platformdirs>=4.3.8",
    "edge-tts>=7.2.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9.4",
    "soundfile>=0.13.1",
    "huggingface-hub>=0.34.4",
]

[project.scripts]
yue = "yue.__main__:cli"

[project.urls]
Homepage = "https://github.com/simgsr/yue"
Repository = "https://github.com/simgsr/yue"
Issues = "https://github.com/simgsr/yue/issues"
"Upstream (Lue)" = "https://github.com/paulilaaso/lue"

[tool.setuptools.packages.find]
include = ["yue*"]

[tool.setuptools.package-data]
yue = ["py.typed", "guide.txt", "*.json"]
